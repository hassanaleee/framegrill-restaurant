<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Premium fast-food and grill-house website template - built with React, Tailwind CSS & Vite." />
  <meta name="author" content="FrameGrill Web" />
  <meta name="keywords"
    content="React restaurant website, grill-house, fast food, Lahore restaurant, FrameGrill, responsive restaurant UI, modern react food theme" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="FrameGrill – Premium Grill-House & Fast Food Restaurant" />

    content="Premium fast-food and grill-house website template - built with React, Tailwind CSS & Vite." />
  <meta property="og:type" content="website" />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=80" />
  <meta property="og:url" content="https://framegrill.pk" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@framegrill" />
  <meta name="twitter:title" content="FrameGrill – Premium Grill-House & Fast Food Restaurant" />
  <meta name="twitter:description"
    content="Premium fast-food and grill-house website template - built with React, Tailwind CSS & Vite." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Dark Mode Script to Prevent Flash of Light Theme -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
